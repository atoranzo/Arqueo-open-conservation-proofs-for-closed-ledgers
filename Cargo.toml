[workspace]
members = [
    "crates/zk-core",
    "crates/iso-bridge",
    "crates/halo2-experiment",
    "crates/settlement-prover",
    "crates/stark-experiment",
    "crates/ceremony",
    "crates/plonk-experiment",
    "crates/nova-experiment",
    "crates/settlement-layer",
    "crates/zk-ssl",
    "crates/zk-ssl-cli",
    "crates/zk-ssl-wire",
    "crates/zk-ssl-node",
    "crates/zk-ssl-sdk",
    # ⚠️ El verificador INDEPENDIENTE (§243): solo depende de `xmss`, para
    # que un tercero no tenga que compilar el nodo para verificar.
    "crates/zk-ssl-verify",
    # ⚠️ El HASH, fuera del probador (§254). Misma regla un nivel mas
    # abajo: un verificador tampoco compila el PROBADOR. Solo depende de
    # `winter-math` y `winter-crypto` SUELTOS, clavados con `=`.
    "crates/zk-ssl-hash",
    # ⚠️ El GUARDIAN del indice (§296). Tercera vez de la misma regla: un
    # TESTIGO no debe compilar el NODO para firmar. Solo depende de `std`.
    "crates/zk-ssl-guardian",
    # ⚠️ Los AIR que un tercero VERIFICA (RFC-0007 D-F, §463). Cuarta
    # vez de la regla: un JUEZ no compila al PROBADOR. `winter-air`,
    # `-crypto`, `-math` y `-verifier` SUELTOS, clavados con `=`; el
    # probador (`winter-prover`) no entra.
    "crates/zk-ssl-air",
    # ⚠️ El FORK de winterfell 0.13.1 (RFC-0009 E3a-1, §533): entra APAGADO
    # por el [patch.crates-io] del final, con los NOMBRES de crates.io, para
    # que el gate de H2 -que mide la clausura del kit por nombre- siga
    # viendo `winter-verifier` y no `winter-prover`. Miembros, para que el
    # canon corra sus tests: un [patch] con path NO hace miembro (medido).
    "crates/winter-air",
    "crates/winter-prover",
    "crates/winter-verifier",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
authors = ["Angel Toranzo Portela"]

# NOTA: versiones fijadas deliberadamente. Arkworks cambia su API entre
# versiones menores con cierta frecuencia; si `cargo build` falla por un
# símbolo no encontrado, lo más probable es que el compilador haya resuelto
# una versión distinta a la probada aquí (0.4.x). En ese caso, fija la
# versión exacta con `cargo update -p <crate> --precise <version>`.
[workspace.dependencies]
ark-ff = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-groth16 = "0.4"
ark-snark = "0.4"
ark-bls12-381 = "0.4"
ark-serialize = "0.4"
rand = "0.8"
rand_chacha = "0.3"

# ⚠️ El FORK (§533): los tres crates de arriba sustituyen a los de crates.io en
# TODO el workspace, kit incluido; `winter-fri`, `-math`, `-crypto` y `-utils`
# siguen siendo los de crates.io. Un [patch] exige el mismo nombre y la misma
# version que el registry; los tres llevan `publish = false`.
[patch.crates-io]
winter-air = { path = "crates/winter-air" }
winter-prover = { path = "crates/winter-prover" }
winter-verifier = { path = "crates/winter-verifier" }
