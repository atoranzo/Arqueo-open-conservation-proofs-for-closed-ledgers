[package]
name = "ceremony"
version = "0.1.0"
edition = "2021"
license.workspace = true

# CÓDIGO VENDORIZADO — ver ATTRIBUTION.md.
#
# El contenido de src/ procede de `penumbra-sdk-proof-setup` v2.1.1
# (Penumbra Labs, MIT/Apache-2.0), módulo `single/`, con una única
# modificación funcional: la curva BLS12-377 se ha reapuntado a
# BLS12-381 mediante el alias `Curve`.
#
# Versiones de arkworks EXACTAS a las del crate original, que además
# coinciden con las de zk-core — esa coincidencia es lo que hace viable
# esta integración.
[dependencies]
ark-ec = { version = "0.4.2", default-features = false }
ark-ff = { version = "0.4.2", default-features = false }
ark-groth16 = { version = "0.4.0", default-features = false }
ark-poly = { version = "0.4.2", default-features = false }
ark-relations = "0.4"
ark-serialize = "0.4.2"
ark-bls12-381 = "0.4"
ark-std = "0.4"
anyhow = "1.0.75"
blake2b_simd = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
# Opcional, igual que en el crate original: habilita las rutas de codigo
# paralelas bajo `#[cfg(feature = "parallel")]`.
rayon = { version = "1.8.0", optional = true }

[features]
parallel = [
    "dep:rayon",
    "ark-ec/parallel",
    "ark-ff/parallel",
    "ark-groth16/parallel",
    "ark-poly/parallel",
]

[dev-dependencies]
ark-r1cs-std = { version = "0.4", default-features = false }
ark-snark = "0.4"
rand = "0.8"
rand_chacha = "0.3"
