[package]
name = "zk-ssl-verify"
version = "0.1.0"
edition = "2021"
license.workspace = true

# **El verificador independiente.** Todo lo que un TERCERO necesita para
# comprobar que una cabeza de epoca firmada la emitio quien dice, y nada mas.
#
# ⚠️ LA DEPENDENCIA VA EN UN SOLO SENTIDO: este crate NO depende de la capa,
# ni del nodo, ni del cable. Decia ademas "Solo de `xmss`" y eso NO aguanta la
# medicion: depende de `zk-ssl-hash` y de `winter-math`, ninguno con prover ni
# verifier de winterfell. Lo de arriba sigue en pie; la frase no, y la misma se
# corrigio en el doc de la constante (§324). Si algun dia importa algo del
# proyecto, se habra vuelto a caer en el problema que §243 resolvio: que la
# unica forma de verificar una cabeza fuera compilar el codigo del operador.
#
# ⚠️ Y deberia ser EL CRATE QUE MENOS CAMBIE: su superficie es el dominio, la
# version de formato y `verificar_cabeza`. Un pin que no se mueve casi no
# cuesta.
#
# ⚠️ §247 (§332): la enumeracion de arriba **ya estaba incompleta** cuando se
# escribio -no nombra `verificar_cofirma`, `preambulo_cofirma` ni
# `clave_desde_bytes`- y este sello la deja peor: anade `indice_de_firma` y
# `ANCHO_INDICE`, y mueve el pin de 62 a 66. La frase de fondo sigue en pie
# -este crate deberia cambiar poco- pero **la lista no es su superficie**: la
# superficie se lee de los `pub` de `src/lib.rs`, no de aqui.

[dependencies]
serde_json = "1"
# ⚠️ **0.1.0-pre.0, SIN auditoría independiente**, declarado por el propio
# crate. Fijada con `=`: es una pre-release y `master` diverge del tag.
# Aqui vive tambien el APAÑO del OID multiarbol (§240) y su CENTINELA, porque
# es un apaño de LECTURA y quien lee es quien verifica.
xmss = "=0.1.0-pre.0"
# ⚠️ §254: el hash nativo, para poder recomputar raices SIN el probador.
#    `zk-ssl-hash` solo depende de `winter-math` y `winter-crypto`
#    sueltos: NO arrastra `winter-prover`, `winter-air` ni
#    `winter-verifier`. La propiedad de §243 sigue en pie.
zk-ssl-hash = { path = "../zk-ssl-hash" }
# ⚠️ Solo para nombrar `BaseElement` en los tests. Clavada a la MISMA
#    version que `zk-ssl-hash`: dos `BaseElement` de versiones distintas
#    NO son el mismo tipo.
winter-math = "=0.13.1"

# ⚠️ Solo para el ATADO del ancho del indice de hoja. Es dev-dependency a
#    proposito: `zk-ssl-verify` NO depende del guardian para funcionar —un
#    tercero no compila el crate del firmante— y el grafo queda aciclico
#    (verify --dev--> guardian, que no depende de nadie).
[dev-dependencies]
zk-ssl-guardian = { path = "../zk-ssl-guardian" }
