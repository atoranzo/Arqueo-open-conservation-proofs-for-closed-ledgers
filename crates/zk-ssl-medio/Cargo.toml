[package]
name = "zk-ssl-medio"
version = "0.1.0"
edition = "2021"
license.workspace = true

# **El medio del ancla** (RFC-0013 E2). El árbol (E2a, §631): cada ancla
# del RFC-0012 es una hoja; los nodos son SHA-256 con los prefijos
# `0x00`/`0x01` de RFC 6962 (D-B), y las pruebas de inclusión y de
# consistencia son las que un testigo genérico de `tlog-witness` comprueba.
# La nota (E2b, §632): el `checkpoint` de C2SP que lo publica, firmado con
# ML-DSA-44 en el tipo `0x06` de `tlog-cosignature` (D-C).
#
# ⚠️ **Es un crate aparte por la regla de siempre** (§243, §254, §296,
# §463): quien comprueba el medio no compila el nodo, ni el probador, ni
# winterfell. Aquí no hay campo finito: hay SHA-256.
#
# ⚠️ **El árbol está COPIADO de mtc-core, no dependido** (D-G, decidido en
# §631): `src/hash.rs` y `src/subtree.rs` de `github.com/atoranzo/mtc-core`
# en `d3b0ca6`, byte a byte salvo las líneas `ADAPTADO (§631)`, y desde el
# §632 la base64 de su `src/pem.rs`. La nota no se copió: se escribió aquí y
# se contrasta con torchwood. Las razones, en `src/lib.rs`.

[dependencies]
# SHA-256, el hash del log (RFC 6962/9162). Ya está en el Cargo.lock del
# workspace en 0.10.9: no entra ninguna versión nueva.
sha2 = "0.10"

# ML-DSA-44 (FIPS 204), la firma de la nota del medio (RFC-0013 D-C, E2b,
# §632): el tipo `0x06` de `tlog-cosignature`, sin estado. Clavado con `=`
# como `xmss`: ⚠️ el propio crate declara que **no está auditado**
# (RFC-0013 D-H, 2). Sin `pkcs8` ni `alloc`: aquí no se lee DER. Con él
# entran 11 paquetes al Cargo.lock y ninguno de los que había cambia de
# versión (medido en §632). Verificar no pide más; firmar, sí: lo pone
# `firmar`, abajo.
ml-dsa = { version = "=0.1.1", default-features = false }
# La sal de la firma con sal (FIPS 204, la variante recomendada): 32 bytes
# del sistema por firma. Ya está en el Cargo.lock en 0.4.3. Solo con
# `firmar`.
getrandom = { version = "0.4", features = ["sys_rng"], optional = true }
# Borrar la copia local de la semilla del publicador. Ya está en el
# Cargo.lock en 1.9.0. Solo con `firmar`.
zeroize = { version = "1", optional = true }

[features]
# ⚠️ **Firmar es opcional desde el §633.** El kit (`zk-ssl-verify`) verifica
# notas y no firma ninguna: depende de este crate sin `firmar`, y así no
# enlaza la sal del sistema, ni el borrado de la semilla, ni el firmado de
# `ml-dsa`. El publicador (E3) y los tests la llevan, y es la de por defecto.
default = ["firmar"]
firmar = ["dep:getrandom", "dep:zeroize", "ml-dsa/rand_core", "ml-dsa/zeroize"]

# Las notas firmadas aquí se rehacen con `Publicador`: sin `firmar` no se
# compila, y se declara.
[[test]]
name = "vectores_notas"
required-features = ["firmar"]
