[package]
name = "zk-ssl-cli"
version = "0.1.0"
edition = "2021"
license.workspace = true

# Sandbox + trazador de la ZK-Sovereign Settlement Layer desde la terminal.
#
# NO reimplementa la capa: ejecuta `zk_ssl::SovereignLayer` de verdad, con
# pruebas STARK reales, y expone tres subcomandos: `simulate`, `trace-tx`
# e `inspect-state`.
#
# ⚠️ Sin `tokio` a propósito: la capa es síncrona y no hay red ni consenso
# (ver lib.rs de zk-ssl, «Lo que esta capa NO es»). Cuando exista un nodo
# con JSON-RPC, añadir aquí una feature `rpc` con tokio + jsonrpsee en vez
# de arrastrar un runtime async que hoy nadie usa.

[dependencies]
# La capa real, con sus ayudantes de escenario expuestos como sandbox.
# Ver PARCHES.md: exige la feature `sandbox` en zk-ssl.
zk-ssl = { path = "../zk-ssl", features = ["sandbox"] }
winterfell = "0.13"

clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
colored = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# ⚠️⚠️ **§312 · CORRECCION. La frase de abajo se CITA, no se borra**
# (§247). El parrafo siguiente excluye `zk-ssl-sdk` porque «arrastraria
# stark-experiment», y ese argumento ya era FALSO cuando se escribio: la
# PRIMERA dependencia de este crate —`zk-ssl` con `sandbox`, linea 21—
# declara `stark-experiment` de forma llana (`crates/zk-ssl/Cargo.toml:25`),
# asi que el probador STARK ya se compila aqui. MEDIDO, no supuesto.
#
# Lo que sigue vivo del §243 es lo que el arbol enuncia y nada mas: **lo
# prohibido es depender de la CAPA o del NODO**. El CABLE no lo esta.
# ⚠️ **El testigo** (§245). Solo esto: `zk-ssl-verify` para verificar y
# `ureq` para hablar. **NO se usa `zk-ssl-sdk`** aunque tenga el cliente
# RPC hecho: arrastraria `stark-experiment`, y **un testigo no debe
# compilar el probador STARK para comprobar una firma**. Es la leccion de
# §243 a menor escala.
zk-ssl-verify = { path = "../zk-ssl-verify" }
# ⚠️ **§411 (RFC-0005, E5).** Los KAT del nucleo: `nucleo_kat` recompone cada fn NUCLEO de
#    `zk-ssl-hash` contra `spec/vectors/nucleo/`. Suma CERO nodos al grafo: `zk-ssl` ya lo trae.
zk-ssl-hash = { path = "../zk-ssl-hash" }
ureq = { version = "2.10", features = ["json"] }

# ⚠️ **El CABLE** (§312). El testigo deja de leer la cabeza firmada a pelo
# y la tipa con `SignedEpochHeadDto`. **Suma exactamente UN nodo al grafo**
# —el cable mismo—: sus cinco dependencias (`zk-ssl`, `winterfell`, `serde`,
# `serde_json`, `stark-experiment`) ya estaban todas en este crate, cuatro
# declaradas arriba y `stark-experiment` por via de `zk-ssl`. MEDIDO.
zk-ssl-wire = { path = "../zk-ssl-wire" }

# ⚠️ **El COFIRMANTE** (§299). El testigo ya no solo mira: firma, y para
# firmar necesita el GUARDIAN del indice —**el mismo crate que usa el nodo**
# (§296, §298), no una copia: dos implementaciones del mismo invariante
# pueden discrepar, y aqui discrepar significa filtrar una clave (§253)— y
# `xmss` para la clave propia.
#
# ⚠️ Esto NO rompe §243: lo prohibido es depender de la CAPA o del NODO.
# El guardian no tiene dependencias y `xmss` ya llegaba de forma transitiva
# por `zk-ssl-verify`; declararla aqui la hace explicita, no nueva.
zk-ssl-guardian = { path = "../zk-ssl-guardian" }
xmss = "=0.1.0-pre.0"

# ⚠️⚠️ **S337** - para borrar el buffer temporal del SK al
# resincronizar. El nodo ya la declara y hace la MISMA operacion; esta linea
# se COPIO de `crates/zk-ssl-node/Cargo.toml`, no se tecleo. Es BEST-EFFORT y
# va dicho en la doc de la funcion.
zeroize = "1"
