[package]
name = "zk-ssl-sdk"
version = "0.1.0"
edition = "2021"
license.workspace = true

# **El SDK de cliente** (análogo a ethers): habla `spec/RPC.md` con un
# nodo y ejecuta el lado del titular: derivar identificadores, PROBAR en
# local (send/claim) y presentar recibos. La clave de gasto no sale del
# proceso como dato; al nodo viajan datos públicos, la clave de VISTA y
# las pruebas, que desde el §538 no la llevan (hasta entonces sí: §521).
#
# Síncrono a propósito (ureq): el flujo del titular es secuencial
# —materiales, probar, aplicar— y un runtime async no aporta nada aquí.

[dependencies]
zk-ssl = { path = "../zk-ssl" }
zk-ssl-wire = { path = "../zk-ssl-wire" }
# La regla de permisos del material de clave tiene UN productor (5.A-404, S199):
# `semilla::comprobar_permisos`. El guardian no arrastra nada: solo `std`.
zk-ssl-guardian = { path = "../zk-ssl-guardian" }
stark-experiment = { path = "../stark-experiment" }
winterfell = "0.13"

ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keystore del wallet: la MISMA construccion de reposo que la capa
# (zk-ssl::crypto), con dominio propio. Ver src/keystore.rs.
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand = { workspace = true }
anyhow = "1"
