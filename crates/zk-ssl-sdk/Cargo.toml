[package]
name = "zk-ssl-sdk"
version = "0.1.0"
edition = "2021"
license.workspace = true

# **El SDK de cliente** (análogo a ethers): habla `spec/RPC.md` con un
# nodo y ejecuta el lado del titular: derivar identificadores, PROBAR en
# local (send/claim) y presentar recibos. La clave de gasto no sale del
# proceso; al nodo solo viajan datos públicos, la clave de VISTA (para la
# consulta autenticada) y pruebas.
#
# Síncrono a propósito (ureq): el flujo del titular es secuencial
# —materiales, probar, aplicar— y un runtime async no aporta nada aquí.

[dependencies]
zk-ssl = { path = "../zk-ssl" }
zk-ssl-wire = { path = "../zk-ssl-wire" }
stark-experiment = { path = "../stark-experiment" }
winterfell = "0.13"

ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { workspace = true }
anyhow = "1"
