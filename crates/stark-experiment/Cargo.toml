[package]
name = "stark-experiment"
version = "0.1.0"
edition = "2021"
license.workspace = true

# Deliberadamente AISLADO del resto del workspace: Winterfell tiene su
# propio ecosistema de campos finitos y hashes (winter-math, winter-crypto),
# distinto tanto de Arkworks como de halo2/pasta_curves. Mismo criterio de
# aislamiento que ya aplicamos con halo2-experiment.
[dependencies]
winterfell = "0.13"
# ⚠️ §254: `native_merge` se mudo aqui para que el VERIFICADOR no arrastre
#    el PROBADOR. Este crate lo REEXPORTA; no hay dos implementaciones.
zk-ssl-hash = { path = "../zk-ssl-hash" }
sled = "0.34"
settlement-prover = { path = "../settlement-prover" }
# ⚠️ §463 (RFC-0007 E4b-1): el AIR de la prueba de edad vive en
#    `zk-ssl-air`, que el kit consume sin el probador; aqui solo van la
#    traza y el `Prover`. Un AIR, un productor.
zk-ssl-air = { path = "../zk-ssl-air" }

# RFC-0009 E3a-2 (S534): los falsadores de D-K encienden la ocultacion del nucleo, y `Ocultacion`,
# `Marca` y `Oculta` no salen por el paraguas `winterfell`, que no esta bifurcado. Solo tests: por
# el [patch.crates-io] del raiz resuelven al fork del arbol, el mismo crate que usa el paraguas.
[dev-dependencies]
winter-air = "=0.13.1"
winter-prover = "=0.13.1"
