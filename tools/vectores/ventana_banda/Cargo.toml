# §723, la ventana del saldo privado en la banda del kit: el generador de los sobres de rechazo
# que un operador arma con una cabeza v5 FIRMADA con su propia clave (una clave XMSS de test, de
# semilla fija) y una hoja que su capa no firmaria -un saldo de la ventana [2^62, 2^63)-, para los
# vectores de `spec/vectors/rechazo/`, y de los cinco de `spec/vectors/completitud/` cuya
# resolucion es un rechazo con la banda de la v1. Fuera del workspace (su propio `[workspace]`),
# con el fork de winterfell del arbol por `[patch.crates-io]` y la feature `probador-v1` de
# `stark-experiment`, que nada del workspace enciende. Lo llama `tools/vectores/ventana_banda.py`.
#
#   cargo run --release --locked -- <caso> <salida.json> [<vector de prenda>]
[package]
name = "ventana-banda"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde_json = "1"
xmss = "=0.1.0-pre.0"
winterfell = "=0.13.1"
winter-prover = "=0.13.1"
zk-ssl-hash = { path = "../../../crates/zk-ssl-hash" }
zk-ssl-verify = { path = "../../../crates/zk-ssl-verify" }
stark-experiment = { path = "../../../crates/stark-experiment", features = ["probador-v1"] }

[patch.crates-io]
winter-air = { path = "../../../crates/winter-air" }
winter-prover = { path = "../../../crates/winter-prover" }
winter-verifier = { path = "../../../crates/winter-verifier" }

[profile.release]
overflow-checks = true
